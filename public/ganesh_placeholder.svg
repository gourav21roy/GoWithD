<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D060F" />
      <stop offset="85%" stop-color="#1A0206" />
      <stop offset="100%" stop-color="#0F0103" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="30%" stop-color="#F7D070" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8F6B08" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 3" opacity="0.8" />

  <!-- Lord Ganesha Artistic Sacred Silhouette / Form -->
  <!-- Mukut / Crown -->
  <polygon points="100,28 114,54 86,54" fill="url(#goldGrad)" />
  <circle cx="100" cy="24" r="3.5" fill="#E2583E" />
  <rect x="88" y="52" width="24" height="4" rx="1.5" fill="#F7D070" />

  <!-- Tilak / Trishul -->
  <path d="M 97 60 Q 100 68 100 74 Q 100 68 103 60 Z" fill="#E2583E" />
  <line x1="94" y1="64" x2="106" y2="64" stroke="#F7D070" stroke-width="1.5" />

  <!-- Trunk & Ears (Sacred Om-Ganesha Contour) -->
  <!-- Left Ear -->
  <path d="M 88 56 C 70 56 62 70 70 82 C 76 90 84 88 88 84" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Right Ear -->
  <path d="M 112 56 C 130 56 138 70 130 82 C 124 90 116 88 112 84" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Head & Trunk Flow -->
  <path d="M 100 58 Q 108 72 108 88 Q 108 106 96 112 Q 86 116 88 126 Q 90 134 102 134 Q 116 134 116 122" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Modak / Laddu in hand -->
  <circle cx="124" cy="116" r="5" fill="#F7D070" stroke="#8F6B08" stroke-width="1" />
  <circle cx="124" cy="113" r="1.5" fill="#E2583E" />

  <!-- Sacred Eyes / Gaze -->
  <circle cx="94" cy="68" r="1.8" fill="#FFF8E7" />
  <circle cx="106" cy="68" r="1.8" fill="#FFF8E7" />

  <!-- Label at bottom: Placeholder note -->
  <rect x="42" y="152" width="116" height="18" rx="9" fill="#120104" stroke="#D4AF37" stroke-width="1" opacity="0.9" />
  <text x="100" y="164.5" text-anchor="middle" font-family="serif" font-size="9" font-weight="bold" fill="#FCE2A6" letter-spacing="0.5">
    GANESH JI PLACEHOLDER
  </text>
</svg>
